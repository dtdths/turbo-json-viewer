<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo JSON Viewer</title>
<link rel="stylesheet" href="./page.css">
</head>
<body data-panel="none" data-view="tree">

<div class="app">
  <nav class="activity" aria-label="活动栏">
    <button class="actbtn is-active" type="button" data-panel-btn="doc" title="文档树" aria-label="文档树">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.4h3.2M3 7.2h6.4M3 11h9.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12.6" cy="3.4" r="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="11.2" cy="11" r="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="actbtn" type="button" data-panel-btn="search" title="搜索 ⌘K" aria-label="搜索">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7.1" cy="7.1" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.4 10.4 3 3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button class="actbtn" type="button" data-panel-btn="outline" title="大纲" aria-label="大纲">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.2h2M2.6 8h2M2.6 11.8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.6 4.2h6.8M6.6 8h6.8M6.6 11.8h4.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".72"/></svg>
    </button>
    <span class="activity__spacer"></span>
    <button class="actbtn" type="button" data-panel-btn="settings" title="设置" aria-label="设置">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.6v10.8M8 2.6v10.8M11.8 2.6v10.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="4.2" cy="6.4" r="1.45" fill="currentColor"/><circle cx="8" cy="9.8" r="1.45" fill="currentColor"/><circle cx="11.8" cy="5.4" r="1.45" fill="currentColor"/></svg>
    </button>
    <button class="actbtn" type="button" id="themeToggle" title="切换主题" aria-label="切换深色 / 亮色主题">
      <svg class="ic-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      <svg class="ic-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.9 9.6A5.4 5.4 0 0 1 6.4 3.1 5.5 5.5 0 1 0 12.9 9.6Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <div class="app__main">
    <header class="toolbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2.75" y="2.75" width="18.5" height="18.5" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 15.6V10.2M12 15.6V7.4M16 15.6v-3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        Turbo JSON Viewer <span class="brand__tag">BETA</span>
      </div>

      <button class="file-chip" type="button" id="fileChip" hidden>
        <span id="fileName">—</span>
        <span class="file-chip__meta" id="fileMeta"></span>
      </button>

      <span class="toolbar__spacer"></span>

      <button class="btn" type="button" id="importBtn">导入</button>
      <div class="splitbtn" role="group" aria-label="导出">
        <button class="btn splitbtn__main" type="button" id="exportBtn" disabled title="导出 JSON 文件" aria-label="导出 JSON 文件">导出</button>
        <button class="btn splitbtn__caret" type="button" id="exportMenuBtn" disabled aria-haspopup="menu" aria-expanded="false" title="选择导出方式" aria-label="选择导出方式">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 6.2 3.4 3.4 3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="btn" type="button" id="editBadge" hidden title="已临时修改，点击重置全部">已修改 0 处</button>
      <div class="segmented" role="group" aria-label="视图切换">
        <button class="segmented__btn is-active" type="button" id="viewTreeBtn" aria-pressed="true" title="树视图（默认）" disabled>树</button>
        <button class="segmented__btn" type="button" id="viewRawBtn" aria-pressed="false" title="原始文本视图（只读原文）" disabled>原文</button>
      </div>
      <button class="btn" type="button" id="expandAllBtn" disabled title="全部展开" aria-label="全部展开">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 8h3.2M11 8h3.2M8 6.2V2.4M5.8 4.4 8 2.2 10.2 4.4M8 9.8v3.8M5.8 11.6 8 13.8 10.2 11.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        全部展开
      </button>
      <button class="btn" type="button" id="collapseAllBtn" disabled title="全部收起" aria-label="全部收起">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 8h3.2M11 8h3.2M8 2.2v3.6M6.2 4.6 8 6.4 9.8 4.6M8 13.8v-3.6M6.2 11.4 8 9.6 9.8 11.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        全部收起
      </button>
      <button class="iconbtn" type="button" id="railToggle" aria-pressed="true" title="右侧工作区" aria-label="折叠右侧工作区">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 3.4v9.2" stroke="currentColor" stroke-width="1.2" opacity=".6"/></svg>
      </button>
      <input type="file" id="fileInput" accept=".json,.ndjson,application/json" hidden>
    </header>

    <!-- 截断修复提示条（#8 / ADR-0004）：32px，常驻到用户关闭或重新导入 -->
    <div class="repairbar" id="repairBar" role="status" aria-live="polite" hidden>
      <svg class="repairbar__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2 14.2 13.4H1.8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M8 6.2v3.2M8 11.6v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="repairbar__text" id="repairText">—</span>
      <button class="linkbtn repairbar__toggle" type="button" id="repairToggle" aria-expanded="false" aria-controls="repairOps">摘要</button>
      <span class="repairbar__spacer"></span>
      <button class="iconbtn repairbar__close" type="button" id="repairClose" aria-label="关闭修复提示">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
      </button>
      <div class="repairbar__ops" id="repairOps" hidden></div>
    </div>

    <!-- 导入体积提示条（#11 / ADR-0003 修订）：>50 MB 时提示源文本常驻内存；
         与修复条同时存在时修复条在上、本条在下（DOM 顺序即层序）；关闭只关条 -->
    <div class="noticebar" id="docWarnBar" role="status" aria-live="polite" hidden>
      <svg class="noticebar__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2 14.2 13.4H1.8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M8 6.2v3.2M8 11.6v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="noticebar__text" id="docWarnText" data-notice-text>—</span>
      <button class="iconbtn noticebar__close" type="button" id="docWarnClose" data-notice-close aria-label="关闭体积提示">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- 保真提示条（#23 / ADR-0003 修订 2026-11-09）：导入后检测到失真（大整数精度/整数键顺序）时出现；
         三条常驻条的 DOM 顺序 = 修复条 → 体积提示条 → 保真条；关闭只关条、不丢报告 -->
    <div class="noticebar" id="fidelityBar" role="status" aria-live="polite" hidden>
      <svg class="noticebar__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2 14.2 13.4H1.8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M8 6.2v3.2M8 11.6v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="noticebar__text" id="fidelityText" data-notice-text>—</span>
      <button class="linkbtn noticebar__action" type="button" id="fidelityJump" data-notice-action>查看原文</button>
      <button class="iconbtn noticebar__close" type="button" id="fidelityClose" data-notice-close aria-label="关闭保真提示">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
      </button>
    </div>

    <main class="workbench">
      <aside class="side side--left" id="leftPanel" aria-label="左侧面板">
        <div class="side__head">
          <span class="side__title" id="panelTitle">搜索</span>
          <span class="side__spacer"></span>
          <button class="iconbtn" type="button" data-panel-close aria-label="关闭面板">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="panel panel--search" id="searchPanel"></div>
        <div class="panel panel--outline" id="outlinePanel"></div>
        <div class="panel panel--settings" id="settingsPanel"></div>
      </aside>

      <div class="tree-wrap">
        <div class="tree" id="tree" role="tree" tabindex="0" aria-label="JSON 树视图"></div>
      </div>

      <!-- 原始文本视图（#11 / ADR-0003 修订）：只读、行虚拟化、语法高亮只对屏幕内行 -->
      <div class="raw-wrap" id="rawWrap">
        <div class="raw-head">
          <span class="raw-head__mode" id="rawModeLabel">原文</span>
          <span class="raw-head__notice" id="rawNotice"></span>
          <span class="raw-head__spacer"></span>
          <span class="raw-head__meta" id="rawMetaLabel"></span>
          <button class="btn raw-head__copy" type="button" id="rawCopyBtn" disabled title="复制整份原始文本到剪贴板">复制原文</button>
        </div>
        <div class="raw" id="raw"></div>
      </div>

      <aside class="rail" id="rail" aria-label="右侧工作区">
        <div class="rail__head">
          <span class="rail__title">工作区</span>
          <span class="rail__spacer"></span>
          <button class="iconbtn" type="button" id="railCollapse" aria-label="折叠右侧工作区">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m9.5 4.5 3.5 3.5-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="rail__body">
          <section class="module">
            <header class="module__head"><span class="module__title">选中节点</span><span class="module__meta">只读</span></header>
            <code class="sel__path" id="selPath">—</code>
            <div class="sel__meta" id="selMeta"></div>
          </section>
          <section class="module">
            <header class="module__head"><span class="module__title">JSON 地图</span><span class="module__meta">v1.1</span></header>
            <div class="placeholder">按 #17 / ADR-0007 在后续 slice 接入</div>
          </section>
          <section class="module">
            <header class="module__head"><span class="module__title">文档概要</span><span class="module__meta">采样</span></header>
            <div class="placeholder" id="profilePlaceholder">导入后采样</div>
          </section>
        </div>
      </aside>
    </main>

    <footer class="statusbar">
      <span class="status__item" id="statusRows">未打开文档</span>
      <span class="status__sep" aria-hidden="true"></span>
      <span class="status__item" id="statusSize">—</span>
      <span class="status__spacer"></span>
      <span class="status__path" id="statusPath"></span>
      <span class="status__spacer"></span>
      <span class="status__item" id="statusState">只读 · 原文件不变</span>
      <span class="status__sep" aria-hidden="true"></span>
      <span class="status__item" id="statusTheme">深色</span>
    </footer>
  </div>
</div>

<section class="empty" id="empty" data-mode="initial">
  <div class="empty__inner" id="emptyInner" tabindex="-1">
    <button class="iconbtn empty__close" type="button" id="emptyClose" aria-label="取消导入" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
    </button>
    <h1 class="empty__title" id="emptyTitle">拖入 JSON，毫秒级开始查看</h1>
    <p class="empty__sub" id="emptySub">本地只读 · 数据不经过网络 · 50 MB 文档由 Worker 常驻</p>
    <div class="empty__warn" id="emptyWarn" hidden>将替换当前文档 <b id="emptyWarnDoc">—</b>；原文件不受影响。</div>
    <div class="empty__error" id="emptyError" role="alert" hidden></div>
    <div class="empty__pending" id="emptyPending" hidden>
      <span>已拖入 <b id="emptyPendingName">—</b>，确认替换当前文档？</span>
      <button class="btn" type="button" id="emptyPendingReplace">替换当前文档</button>
    </div>
    <div class="empty__busy" id="emptyBusy" hidden>正在解析…</div>
    <div class="dropzone" id="dropzone" role="button" tabindex="0">
      <strong>拖放 JSON 文件到这里</strong>
      <span class="dropzone__hint">或 <button class="linkbtn" type="button" id="pickBtn">选择文件</button> · <kbd>⌘V</kbd> 粘贴剪贴板</span>
    </div>
  </div>
</section>

<!-- slice 5：子树 JSON 编辑弹层（720×520；CM6 懒加载，DOM 契约见 view/panels/subtree-editor.ts） -->
<div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel">
    <header class="modal__head">
      <h2 class="modal__title" id="editTitle">编辑节点 JSON</h2>
      <span class="modal__kind" id="editKind">object</span>
      <span class="modal__size" id="editSize">—</span>
      <button class="iconbtn modal__close" type="button" data-close aria-label="关闭编辑弹层">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
      </button>
    </header>
    <code class="modal__path" id="editPath">$</code>
    <div class="modal__editor" id="editHost"></div>
    <div class="modal__error" id="editError" role="alert" hidden></div>
    <footer class="modal__foot">
      <span class="modal__note">仅临时修改，不写回原文件</span>
      <button class="linkbtn modal__restore" type="button" id="editRestore">恢复当前值</button>
      <span class="modal__spacer"></span>
      <button class="btn" type="button" id="editCancel">取消</button>
      <button class="btn btn--primary" type="button" id="editApply">Apply</button>
    </footer>
  </div>
</div>

<!-- 树行右键菜单（slice 5 编辑 + ADR-0010 复制四格式） -->
<div class="ctxmenu" id="ctxMenu" role="menu" hidden>
  <button class="ctxmenu__item" type="button" role="menuitem" data-act="copy-subtree">复制子树 JSON</button>
  <button class="ctxmenu__item" type="button" role="menuitem" data-act="copy-path">复制路径</button>
  <button class="ctxmenu__item" type="button" role="menuitem" data-act="copy-value">复制原始值</button>
  <button class="ctxmenu__item" type="button" role="menuitem" data-act="copy-key">复制键名</button>
  <div class="ctxmenu__sep" role="separator"></div>
  <button class="ctxmenu__item" type="button" role="menuitem" data-act="edit">编辑此节点 JSON</button>
</div>

<!-- 导出方式菜单（ADR-0012：主按钮执行上次方式，箭头选另一种） -->
<div class="ctxmenu exportmenu" id="exportMenu" role="menu" aria-label="导出方式" hidden>
  <button class="ctxmenu__item exportmenu__item" type="button" role="menuitemradio" aria-checked="true" data-export-mode="file"><span class="exportmenu__check" aria-hidden="true"></span>导出 JSON 文件</button>
  <button class="ctxmenu__item exportmenu__item" type="button" role="menuitemradio" aria-checked="false" data-export-mode="clipboard"><span class="exportmenu__check" aria-hidden="true"></span>复制 JSON 到剪贴板</button>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="./page.js"></script>
</body>
</html>
